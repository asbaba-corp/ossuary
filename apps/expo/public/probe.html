<!doctype html>
<!-- Sonda de fluidez, temporária. Carrega o app num iframe de MESMA ORIGEM, o
     que o põe no mesmo thread principal, e mede os intervalos entre quadros do
     rAF. Travamento do app aparece aqui como quadro longo. O resultado vai
     para o <title>, que é o que o --dump-dom consegue ler. -->
<meta charset="utf-8">
<title>medindo…</title>
<style>html,body{margin:0;height:100%}iframe{width:1100px;height:760px;border:0}</style>
<iframe src="/"></iframe>
<script>
  const deltas = [];
  let anterior = performance.now();
  const INICIO = anterior;
  function quadro(agora) {
    deltas.push(agora - anterior);
    anterior = agora;
    if (agora - INICIO < 12000) { requestAnimationFrame(quadro); return; }

    // descarta os 2 primeiros segundos: carga do CanvasKit e dos sprites
    const uteis = deltas.slice(120);
    const ordenados = [...uteis].sort((a, b) => a - b);
    const p = (q) => ordenados[Math.floor(ordenados.length * q)] || 0;
    const media = uteis.reduce((s, d) => s + d, 0) / uteis.length;
    const longos = uteis.filter((d) => d > 50).length;
    const linha = `fps_medio=${(1000 / media).toFixed(1)} p50=${p(0.5).toFixed(1)}ms `
      + `p95=${p(0.95).toFixed(1)}ms pior=${ordenados[ordenados.length - 1].toFixed(0)}ms `
      + `quadros_acima_50ms=${longos}/${uteis.length}`;
    document.title = linha;
    // headless não devolve o title; o receptor local sim
    fetch("http://127.0.0.1:9333/r?" + encodeURIComponent(linha), { mode: "no-cors" });
  }
  requestAnimationFrame(quadro);
</script>
